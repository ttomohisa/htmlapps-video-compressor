name: Validate standalone HTML

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - "src/**"
      - "scripts/**"
      - "app.config.json"
      - "dependencies.json"
      - "build-standalone.ps1"
      - "build-standalone.bat"
      - ".github/workflows/build-standalone.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Build and verify standalone HTML
        shell: pwsh
        run: .\scripts\check-repository.ps1

      - name: Upload standalone artifact
        uses: actions/upload-artifact@v7
        with:
          name: local-video-compressor-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            dist/index.html
            dist/index.mt.html
            dist/index.mt.self-extract.html
            dist/dependency-manifest.mt.json
            dist/self-extract-manifest.mt.json
            video-compressor.mt.html
            dist/index.self-extract.html
            dist/dependency-manifest.json
            dist/self-extract-manifest.json
            dist/.nojekyll
            video-compressor.html
          if-no-files-found: error
          retention-days: 14
