name: Validate standalone app

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Build and check application regressions
        shell: powershell
        run: .\scripts\check-repository.ps1
      - name: Upload validation artifact
        uses: actions/upload-artifact@v7
        with:
          name: local-video-compressor
          path: |
            dist/index.html
            dist/index.mt.html
            dist/index.mt.self-extract.html
            dist/dependency-manifest.mt.json
            dist/self-extract-manifest.mt.json
            video-compressor.mt.html
            dist/index.self-extract.html
            dist/dependency-manifest.json
            dist/self-extract-manifest.json
            video-compressor.html
          if-no-files-found: error
